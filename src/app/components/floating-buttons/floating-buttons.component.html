<ion-content>
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="custom-fab-container">

    <ion-fab-button>
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>

    <ion-fab-list side="start">
      <ion-fab-button href="https://github.com/1337KR3W" target="_blank">
        <ion-icon name="logo-github"></ion-icon>
      </ion-fab-button>

      <ion-fab-button href="https://linkedin.com/in/josejoaquinsoftware" target="_blank">
        <ion-icon name="logo-linkedin"></ion-icon>
      </ion-fab-button>
    </ion-fab-list>
    <ion-fab-list side="top">
      <ion-fab-button (click)="changeTheme('green')" color="success" (keyup.enter)="changeTheme('green')"
        (keyup.space)="changeTheme('green')" aria-label="Change to green theme"></ion-fab-button>
      <ion-fab-button (click)="changeTheme('blue')" color="secondary" (keyup.enter)="changeTheme('blue')"
        (keyup.space)="changeTheme('blue')" aria-label="Change to blue theme"></ion-fab-button>
      <ion-fab-button (click)="changeTheme('red')" color="danger" (keyup.enter)="changeTheme('red')"
        (keyup.space)="changeTheme('red')" aria-label="Change to red theme"></ion-fab-button>
    </ion-fab-list>
  </ion-fab>
</ion-content>
